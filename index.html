<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rain Neon Drive</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#dff;font-family:Inter,Segoe UI,Arial,sans-serif}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#030712}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 0 12px #7ff;color:#dff}.box{position:absolute;padding:18px 22px;border-radius:24px;border:1px solid rgba(80,220,255,.34);background:rgba(0,12,24,.58);box-shadow:0 0 40px rgba(0,200,255,.16),inset 0 0 30px rgba(40,180,255,.06);backdrop-filter:blur(8px);font-weight:700}#panel{left:28px;top:22px;line-height:1.75;font-size:20px;min-width:240px}#race{right:28px;top:24px;line-height:1.75;font-size:20px;min-width:260px;border-color:rgba(255,55,220,.38);box-shadow:0 0 42px rgba(255,0,210,.16);pointer-events:auto;cursor:pointer}#speed{position:absolute;left:34px;bottom:28px;font-size:86px;font-weight:900;letter-spacing:-5px;color:#aefcff}.unit{font-size:26px;letter-spacing:0;margin-left:7px}.slip{color:#ff5cae}.ok{color:#70ffbf}#map{position:absolute;right:28px;bottom:28px;width:260px;height:260px;border-radius:24px;border:1px solid rgba(170,240,255,.38);background:rgba(0,12,22,.68);box-shadow:0 0 34px rgba(0,210,255,.22)}#tips{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);font-size:19px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.18);padding:10px 20px;border-radius:999px;color:#dff}#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen;transition:opacity .08s}
</style></head>
<body><canvas id="game"></canvas><div id="hud"><div id="panel" class="box"></div><div id="race" class="box"></div><div id="speed">0<span class="unit">km/h</span></div><canvas id="map" width="520" height="520"></canvas><div id="tips">W/S 油门刹车 · A/D 转向 · Space 手刹漂移 · C 视角 · R 复位 · 点击画面锁定鼠标</div></div><div id="flash"></div>
<script>
const cv=document.getElementById('game'),g=cv.getContext('2d'),map=document.getElementById('map'),mg=map.getContext('2d');
const panel=document.getElementById('panel'),raceBox=document.getElementById('race'),speedBox=document.getElementById('speed'),flash=document.getElementById('flash');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let keys={},view=0;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyC')view=1-view;if(e.code==='KeyR')resetCar();if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);cv.addEventListener('click',()=>document.body.requestPointerLock?.());raceBox.onclick=()=>newRace();
const car={x:0,z:0,speed:0,yaw:0,latVel:0,steer:0,rpm:900,gear:1,slip:false,throttle:0,brake:0};function resetCar(){car.x=0;car.z=0;car.speed=0;car.yaw=0;car.latVel=0;particles.length=0}
const roadW=22,block=72,cityW=16;let rain=.75,lightning=0,nextBolt=10,best=+(localStorage.bestRainDrive||0),raceStart=0,cp=0;let checkpoints=[];function newRace(){checkpoints=[];cp=0;raceStart=0;for(let i=0;i<7;i++)checkpoints.push({x:rnd(-6,6),z:260+i*rnd(220,340)})}newRace();
const buildings=[];for(let i=0;i<260;i++){let side=Math.random()<.5?-1:1,z=i*38+rnd(20,80);buildings.push({side,z,w:rnd(10,28),h:rnd(45,170),c:['#00e5ff','#ff2bd6','#ffb000','#72ff8a','#8d6bff'][i%5],sign:Math.random()<.7})}
const ai=[];for(let i=0;i<34;i++)ai.push({x:rnd(-6,6),z:rnd(120,3600),v:rnd(12,30),c:['#ff405a','#19d9ff','#fff05b','#ff9b23','#b6ff6c'][i%5],lane:(i%4-1.5)*3.2});
const particles=[];function addParticle(x,y,vx,vy,life,c,s){particles.push({x,y,vx,vy,life,c,s})}
const rainDrops=Array.from({length:620},()=>({x:Math.random(),y:Math.random(),l:rnd(12,30),v:rnd(420,780),a:rnd(.18,.55),d:rnd(-28,-10)}));
function physics(dt){car.throttle=(keys.KeyW||keys.ArrowUp)?1:0;car.brake=(keys.KeyS||keys.ArrowDown)?1:0;let hand=keys.Space?1:0,steerIn=(keys.KeyD?1:0)-(keys.KeyA?1:0);car.steer=lerp(car.steer,steerIn,dt*6);let acc=car.throttle*26-car.brake*(car.speed>1?48:20)-car.speed*.10;car.speed+=acc*dt;if(car.brake&&car.speed<2)car.speed-=22*dt;car.speed=clamp(car.speed,-16,58);let grip=clamp(1-Math.abs(car.speed)/120-hand*.65,.18,1);car.latVel+=(car.steer*car.speed*.55-car.latVel*grip*2.4)*dt;car.x+=car.latVel*dt+car.steer*Math.abs(car.speed)*dt*.08;car.x=clamp(car.x,-9.5,9.5);car.z+=car.speed*dt;car.yaw=lerp(car.yaw,car.steer*.18+car.latVel*.018,dt*4);car.slip=Math.abs(car.latVel)>5.2||(hand&&Math.abs(car.speed)>18)||Math.abs(car.steer*car.speed)>80;if(car.slip||Math.abs(car.speed)>38){for(let i=0;i<(car.slip?4:1);i++)addParticle(W/2+rnd(-70,70),H-rnd(90,180),rnd(-25,25),rnd(-45,-8),rnd(.25,.75),car.slip?'rgba(210,220,230,.32)':'rgba(100,180,220,.24)',rnd(6,16))}car.gear=car.speed<-.5?'R':Math.max(1,Math.min(6,Math.floor(Math.abs(car.speed)*3.6/42)+1));car.rpm=clamp(850+(Math.abs(car.speed)*3.6%42)/42*5600+car.throttle*900,800,7600);for(const a of ai){a.z+=a.v*dt;if(a.z<car.z-120)a.z=car.z+rnd(900,2600);if(a.z>car.z+2800)a.z=car.z+rnd(200,1100);if(Math.abs((a.z-car.z))<12&&Math.abs(a.x-car.x)<2.3){car.speed*=.45;car.latVel+=(car.x-a.x)*8;for(let i=0;i<30;i++)addParticle(W/2+rnd(-50,50),H*.65+rnd(-20,30),rnd(-90,90),rnd(-90,20),rnd(.18,.5),'#ffbc56',rnd(2,5))}}
let c=checkpoints[cp];if(c&&Math.abs(c.z-car.z)<24&&Math.abs(c.x-car.x)<5.8&&Math.abs(car.speed)>12){if(cp===0&&!raceStart)raceStart=performance.now();cp++;if(cp>=checkpoints.length){let t=(performance.now()-raceStart)/1000;if(!best||t<best){best=t;localStorage.bestRainDrive=best.toFixed(2)}newRace()}}}
function project(wx,wz,height=0){let dz=wz-car.z;if(dz<3)return null;let curve=Math.sin((wz)*.002)*5+Math.sin((wz)*.006)*2;let relX=wx-car.x-curve;let horizon=H*.50;let y=horizon+4200/dz-height*240/dz;let scale=560/dz;let x=W/2+relX*scale;return {x,y,scale,dz}}
function drawRoad(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#02050d');sky.addColorStop(.45,'#061425');sky.addColorStop(1,'#03070d');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<240;i++){let sx=(i*997+Math.floor(car.z)*.03)%W,sy=(i*613)%H*.52;g.globalAlpha=(i%7?0.18:.45);g.fillRect(sx,sy,i%9?1.2:2.5,i%9?1.2:2.5)}g.globalAlpha=1;if(lightning>0){g.fillStyle=`rgba(210,235,255,${lightning*.5})`;g.fillRect(0,0,W,H)}
let strips=[];for(let i=96;i>=1;i--){let z=car.z+i*13,p1=project(-roadW/2,z),p2=project(roadW/2,z),p3=project(-roadW/2,z+14),p4=project(roadW/2,z+14);if(!p1||!p3)continue;strips.push([p1,p2,p3,p4,z])}for(const [p1,p2,p3,p4,z] of strips){let grad=g.createLinearGradient(0,p1.y,0,p3.y);grad.addColorStop(0,'#0b131b');grad.addColorStop(1,'#172534');g.fillStyle=grad;g.beginPath();g.moveTo(p1.x,p1.y);g.lineTo(p2.x,p2.y);g.lineTo(p4.x,p4.y);g.lineTo(p3.x,p3.y);g.closePath();g.fill();g.strokeStyle='rgba(120,220,255,.08)';g.stroke();if(Math.floor(z/28)%2===0){for(let lx of [-3.5,3.5]){let a=project(lx,z),b=project(lx,z+8);if(a&&b){g.strokeStyle='rgba(210,250,255,.85)';g.lineWidth=Math.max(1,a.scale*.05);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}}for(let lx of [-roadW/2,roadW/2]){let a=project(lx,z),b=project(lx,z+14);if(a&&b){g.strokeStyle='rgba(0,220,255,.35)';g.lineWidth=Math.max(1,a.scale*.04);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}}
// wet reflection bands
for(let i=0;i<26;i++){let z=car.z+i*45+20,p=project(0,z);if(!p)continue;g.fillStyle=`rgba(70,190,255,${.04+Math.random()*.04})`;g.beginPath();g.ellipse(W/2+rnd(-120,120),p.y+rnd(-5,10),p.scale*rnd(1.4,3.8),p.scale*rnd(.04,.12),0,0,TAU);g.fill()}}
function drawBuildings(){let arr=buildings.map(b=>({...b,p:project(b.side*(roadW/2+cityW),b.z)})).filter(b=>b.p&&b.p.dz<1700).sort((a,b)=>b.p.dz-a.p.dz);for(const b of arr){let p=b.p,w=b.w*p.scale*.16,h=b.h*p.scale*.24,x=p.x-b.side*w*.5,y=p.y-h;g.fillStyle='rgba(2,8,16,.92)';g.fillRect(x,y,w,h);g.strokeStyle='rgba(80,180,255,.18)';g.strokeRect(x,y,w,h);for(let yy=y+10;yy<y+h-8;yy+=14*p.scale*.03+7){for(let xx=x+5;xx<x+w-5;xx+=10){if((xx+yy+b.z)%3<1.3){g.fillStyle=b.c+'88';g.fillRect(xx,yy,4,2)}}}if(b.sign){g.shadowColor=b.c;g.shadowBlur=18;g.fillStyle=b.c;g.fillRect(x+w*.18,y+h*.38,w*.64,Math.max(2,h*.035));g.shadowBlur=0}let lp=project(b.side*(roadW/2+1.5),b.z-8);if(lp&&lp.dz<800){g.strokeStyle='rgba(255,210,120,.45)';g.lineWidth=2;g.beginPath();g.moveTo(lp.x,lp.y);g.lineTo(lp.x,lp.y-35*lp.scale*.12);g.stroke();g.shadowColor='#ffc368';g.shadowBlur=20;g.fillStyle='#ffd68a';g.beginPath();g.arc(lp.x,lp.y-35*lp.scale*.12,Math.max(2,lp.scale*.035),0,TAU);g.fill();g.shadowBlur=0}}}
function drawCars(){let visible=ai.map(a=>({...a,p:project(a.x,a.z)})).filter(a=>a.p&&a.p.dz<900).sort((a,b)=>b.p.dz-a.p.dz);for(const a of visible){let p=a.p,w=2.2*p.scale,h=1.15*p.scale;if(w<3)continue;g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(p.x,p.y+h*.55,w*.7,h*.25,0,0,TAU);g.fill();g.fillStyle=a.c;g.fillRect(p.x-w/2,p.y-h,w,h*.75);g.fillStyle='rgba(180,230,255,.75)';g.fillRect(p.x-w*.28,p.y-h*.85,w*.56,h*.28);g.fillStyle='#ff1832';g.shadowColor='#ff1832';g.shadowBlur=12;g.fillRect(p.x-w*.38,p.y-h*.08,w*.22,h*.1);g.fillRect(p.x+w*.16,p.y-h*.08,w*.22,h*.1);g.shadowBlur=0}}
function drawCheckpoint(){let c=checkpoints[cp];if(!c)return;let p=project(c.x,c.z,0);if(!p||p.dz>1200)return;let r=5.8*p.scale;g.save();g.translate(p.x,p.y-r*.4);g.shadowColor=cp?'#00e5ff':'#ff2bd6';g.shadowBlur=35;g.strokeStyle=cp?'#00e5ff':'#ff2bd6';g.lineWidth=Math.max(3,p.scale*.05);g.beginPath();g.ellipse(0,0,r,r*.45,0,0,TAU);g.stroke();g.fillStyle='rgba(0,229,255,.16)';g.beginPath();g.moveTo(0,-r*.9);g.lineTo(r*.55,r*.65);g.lineTo(-r*.55,r*.65);g.closePath();g.fill();g.restore()}
function drawPlayer(){if(view){g.fillStyle='rgba(2,7,13,.82)';g.fillRect(0,H*.78,W,H*.22);g.fillStyle='#111b24';g.fillRect(W*.28,H*.79,W*.44,H*.12);g.strokeStyle='rgba(80,220,255,.45)';g.lineWidth=3;g.strokeRect(W*.28,H*.79,W*.44,H*.12);g.fillStyle='rgba(30,90,120,.7)';g.fillRect(W*.38,H*.72,W*.24,H*.08)}else{let x=W/2+car.yaw*900,y=H*.78;g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(x,y+42,95,24,0,0,TAU);g.fill();g.fillStyle='#145dff';g.shadowColor='#39a8ff';g.shadowBlur=16;g.beginPath();g.roundRect(x-58,y-32,116,58,14);g.fill();g.fillStyle='#08111c';g.roundRect(x-38,y-58,76,34,10);g.fill();g.fillStyle='#dff9ff';g.fillRect(x-42,y-30,18,7);g.fillRect(x+24,y-30,18,7);g.shadowBlur=0}}
function drawRain(dt){rain=clamp(rain+Math.sin(performance.now()*.00011)*dt*.05+rnd(-.02,.02)*dt,.42,1.18);g.lineWidth=1;let n=Math.floor(rainDrops.length*rain);for(let i=0;i<n;i++){let r=rainDrops[i];r.y+=r.v*dt/H;r.x+=(r.d-car.steer*16)*dt/W;if(r.y>1.08||r.x<-0.08||r.x>1.08){r.x=Math.random();r.y=rnd(-.18,0);r.l=rnd(12,32);r.v=rnd(420,780);r.a=rnd(.14,.48);r.d=rnd(-30,-12)}let x=r.x*W,y=r.y*H,len=r.l+Math.abs(car.speed)*.09;g.strokeStyle=`rgba(165,225,255,${r.a})`;g.beginPath();g.moveTo(x,y);g.lineTo(x+r.d*.55-car.steer*8,y+len);g.stroke()} }
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=15*dt;if(p.life<=0){particles.splice(i,1);continue}g.globalAlpha=clamp(p.life*2,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s*(1-p.life*.4),0,TAU);g.fill();g.globalAlpha=1}}
function drawMap(){mg.clearRect(0,0,520,520);mg.fillStyle='rgba(0,12,22,.82)';mg.fillRect(0,0,520,520);mg.translate(260,260);mg.strokeStyle='rgba(110,220,255,.35)';mg.lineWidth=7;for(let i=-8;i<=8;i++){mg.beginPath();mg.moveTo(i*24,-250);mg.lineTo(i*24,250);mg.stroke();mg.beginPath();mg.moveTo(-250,i*24+(car.z*.08%24));mg.lineTo(250,i*24+(car.z*.08%24));mg.stroke()}mg.fillStyle='#ff2bd6';let c=checkpoints[cp];if(c){mg.beginPath();mg.arc((c.x-car.x)*10,(c.z-car.z)*.18,8,0,TAU);mg.fill()}mg.fillStyle='#ffef48';for(const a of ai){let dz=(a.z-car.z)*.18;if(dz>-240&&dz<240)mg.fillRect((a.x-car.x)*10-3,dz-3,6,6)}mg.fillStyle='#35f5ff';mg.beginPath();mg.moveTo(0,-18);mg.lineTo(13,18);mg.lineTo(0,8);mg.lineTo(-13,18);mg.closePath();mg.fill();mg.setTransform(1,0,0,1,0,0);mg.strokeStyle='rgba(255,255,255,.35)';mg.strokeRect(1,1,518,518)}
function hud(){let kmh=Math.round(Math.abs(car.speed)*3.6);speedBox.innerHTML=`${kmh}<span class="unit">km/h</span>`;panel.innerHTML=`RPM <b>${Math.round(car.rpm)}</b><br>档位 <b>${car.gear}</b><br>油门 <b>${Math.round(car.throttle*100)}%</b>　刹车 <b>${Math.round(car.brake*100)}%</b><br>转向角 <b>${Math.round(car.steer*34)}°</b><br>抓地状态 <b class="${car.slip?'slip':'ok'}">${car.slip?'正在打滑 / 漂移':'稳定'}</b><br>雨量 <b>${Math.round(rain*100)}%</b>　视角 <b>${view?'驾驶舱':'追尾'}</b>`;let now=raceStart?(performance.now()-raceStart)/1000:0;raceBox.innerHTML=`<b>CHECKPOINT ${Math.min(cp+1,checkpoints.length)} / ${checkpoints.length}</b><br>当前时间 <b>${now?now.toFixed(2):'--'}</b><br>最佳时间 <b>${best?Number(best).toFixed(2):'--'}</b><br><span style="color:#ff73e7">点击这里 Reset Race</span>`}
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;physics(dt);drawRoad();drawBuildings();drawCheckpoint();drawCars();drawPlayer();drawRain(dt);updateParticles(dt);drawMap();hud();nextBolt-=dt;if(nextBolt<0){lightning=1;nextBolt=rnd(9,22);flash.style.opacity=.65;setTimeout(()=>flash.style.opacity=0,70)}lightning=Math.max(0,lightning-dt*3.2);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
