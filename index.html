<style>

const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);

const hemi=new THREE.HemisphereLight(0x5d8fd8,0x09121c,.82); scene.add(hemi); const moon=new THREE.DirectionalLight(0x8bb7ff,.35); moon.position.set(-80,120,-60); moon.castShadow=true; moon.shadow.mapSize.set(2048,2048); moon.shadow.camera.left=-130; moon.shadow.camera.right=130; moon.shadow.camera.top=130; moon.shadow.camera.bottom=-130; scene.add(moon);

function makeNoiseCanvas(w,h,base,glow){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<900;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.08})`;x.fillRect(Math.random()*w,Math.random()*h,1,1)}for(let i=0;i<24;i++){x.fillStyle=glow;x.fillRect(rnd(8,w-24),rnd(10,h-20),rnd(5,18),rnd(3,10))}return new THREE.CanvasTexture(c)}
const wetTex=makeNoiseCanvas(512,512,'#10151b','rgba(30,180,255,.09)'); wetTex.wrapS=wetTex.wrapT=THREE.RepeatWrapping; wetTex.repeat.set(44,44);
const roadMat=new THREE.MeshStandardMaterial({color:0x192431,roughness:.13,metalness:.35,map:wetTex,emissive:0x050b12,emissiveIntensity:.55,envMapIntensity:1});
const sideMat=new THREE.MeshStandardMaterial({color:0x15191c,roughness:.48,metalness:.05});

const CITY=9, BLOCK=42, ROAD=13, HALF=CITY*BLOCK/2; const colliders=[];
const world=new THREE.Group(); scene.add(world);
function addBox(x,z,w,d,h,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;world.add(m);colliders.push({x,z,w,d,r:Math.hypot(w,d)/2,type:'solid'});return m}
function roadPlane(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),roadMat);m.position.set(x,.0,z);m.receiveShadow=true;world.add(m);return m}
// city road grid
for(let i=-CITY;i<=CITY;i++){roadPlane(i*BLOCK,0,ROAD,CITY*BLOCK*2+ROAD); roadPlane(0,i*BLOCK,CITY*BLOCK*2+ROAD,ROAD)}
for(let i=-CITY;i<=CITY;i++)for(let j=-CITY;j<=CITY;j++){ // markings at blocks/intersections
  const x=i*BLOCK,z=j*BLOCK;
  if(i<CITY){for(let k=0;k<4;k++){const l=new THREE.Mesh(new THREE.BoxGeometry(7,.1,.34),lineMat);l.position.set(x+ROAD/2+7+k*10,.08,z);world.add(l)} }

}
// buildings, neon signs, lamps, signals
const buildingMats=[]; for(let n=0;n<9;n++){const tex=makeNoiseCanvas(128,256,`hsl(${215+n*8},28%,${9+n}%)`, n%2?'rgba(0,230,255,.5)':'rgba(255,30,210,.42)');buildingMats.push(new THREE.MeshStandardMaterial({color:0x111827,roughness:.62,metalness:.08,map:tex,emissive:n%2?0x003344:0x33002b,emissiveIntensity:.18}))}
const neonColors=[0x00e5ff,0xff2bd6,0xffb000,0x75ff6a,0x7d5cff];
for(let i=-CITY;i<CITY;i++)for(let j=-CITY;j<CITY;j++){if(Math.abs(i)%1||Math.abs(j)%1)continue; const cx=i*BLOCK+BLOCK/2, cz=j*BLOCK+BLOCK/2; if(Math.abs(cx)<28&&Math.abs(cz)<28)continue; const n=1+Math.floor(Math.random()*3); for(let b=0;b<n;b++){const w=rnd(12,26), d=rnd(12,26), h=rnd(18,105); const x=cx+rnd(-9,9),z=cz+rnd(-9,9); const mesh=addBox(x,z,w,d,h,buildingMats[Math.floor(Math.random()*buildingMats.length)]); if(Math.random()<.62){const col=neonColors[Math.floor(Math.random()*neonColors.length)];const sign=new THREE.Mesh(new THREE.BoxGeometry(w*.72,3.2,.22),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.9,roughness:.2}));sign.position.set(x,h*.45,z+d/2+.16);world.add(sign);const pl=new THREE.PointLight(col,.45,30,2);pl.position.copy(sign.position);world.add(pl)}}}
function addLamp(x,z){const g=new THREE.Group();const pole=new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,5,8),new THREE.MeshStandardMaterial({color:0x27313a,metalness:.6,roughness:.35}));pole.position.y=2.5;g.add(pole);const head=new THREE.Mesh(new THREE.SphereGeometry(.48,12,8),new THREE.MeshStandardMaterial({color:0xffe4a0,emissive:0xffaa44,emissiveIntensity:1.7}));head.position.y=5.35;g.add(head);const l=new THREE.PointLight(0xffb86a,1.15,30,2.0);l.position.y=5.3;l.castShadow=false;g.add(l);g.position.set(x,0,z);world.add(g)}

for(let i=-CITY;i<=CITY;i++)for(let j=-CITY;j<=CITY;j++){const x=i*BLOCK,z=j*BLOCK; if(Math.random()<.72){addLamp(x+ROAD*.85,z+ROAD*.85);addLamp(x-ROAD*.85,z-ROAD*.85)} if(Math.abs(i)+Math.abs(j)>1&&Math.random()<.85){addSignal(x+7,z+7,Math.PI/4);addSignal(x-7,z-7,-Math.PI*3/4)}}
// Guaranteed visible opening vista: bright wet asphalt, lane reflectors, lamps and near skyline.
for(let z=-28;z<=168;z+=14){
  for(const x of [-6.2,6.2]){const r=new THREE.Mesh(new THREE.BoxGeometry(.55,.14,2.6),new THREE.MeshStandardMaterial({color:0x7fe7ff,emissive:0x2bdcff,emissiveIntensity:1.25,roughness:.12}));r.position.set(x,.16,z);world.add(r)}

}
for(const side of [-1,1])for(let k=0;k<5;k++){const z=32+k*35,x=side*rnd(26,42),h=48+k*9;const b=addBox(x,z,rnd(12,19),rnd(16,24),h,buildingMats[(k+side+9)%buildingMats.length]);const col=neonColors[(k+(side>0?2:0))%neonColors.length];const sign=new THREE.Mesh(new THREE.BoxGeometry(10,3,.35),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:3.2,roughness:.15}));sign.position.set(x,h*.55,z-side*12);sign.rotation.y=side>0?Math.PI:0;world.add(sign);const pl=new THREE.PointLight(col,1.2,46,2);pl.position.copy(sign.position);world.add(pl)}

function makeCar(color=0x106dff,emissive=0x001122){const g=new THREE.Group();const bodyMat=new THREE.MeshStandardMaterial({color,roughness:.32,metalness:.65,emissive,emissiveIntensity:.08});const dark=new THREE.MeshStandardMaterial({color:0x02060b,roughness:.12,metalness:.35});const tireMat=new THREE.MeshStandardMaterial({color:0x050505,roughness:.75});const body=new THREE.Mesh(new THREE.BoxGeometry(2.15,.65,4.4),bodyMat);body.position.y=.65;body.castShadow=true;g.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.95,.32,1.55),bodyMat);hood.position.set(0,.95,-1.45);hood.castShadow=true;g.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.75,.85,1.75),dark);cabin.position.set(0,1.25,.35);cabin.castShadow=true;g.add(cabin);const rear=new THREE.Mesh(new THREE.BoxGeometry(2.05,.42,1.15),bodyMat);rear.position.set(0,.93,1.65);rear.castShadow=true;g.add(rear);for(const x of [-1.16,1.16])for(const z of [-1.55,1.55]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.32,18),tireMat);w.rotation.z=Math.PI/2;w.position.set(x,.36,z);w.castShadow=true;g.add(w)}const headL=new THREE.SpotLight(0xcfeeff,4,85,.28,.55,1.0);headL.position.set(-.65,.86,-2.35);headL.target.position.set(-.75,.25,-13);g.add(headL);g.add(headL.target);const headR=headL.clone();headR.position.x=.65;headR.target.position.x=.75;g.add(headR);g.add(headR.target);for(const x of [-.68,.68]){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.36,.18,.08),new THREE.MeshStandardMaterial({color:0xdff6ff,emissive:0xaedfff,emissiveIntensity:2.5}));lamp.position.set(x,.8,-2.25);g.add(lamp);const tail=new THREE.Mesh(new THREE.BoxGeometry(.35,.16,.08),new THREE.MeshStandardMaterial({color:0xff1b28,emissive:0xff0b18,emissiveIntensity:1.8}));tail.position.set(x,.75,2.25);g.add(tail)}return g}
const playerMesh=makeCar(0x1b5cff,0x001438);scene.add(playerMesh);let car={pos:new THREE.Vector3(0,.08,0),yaw:Math.PI,vel:new THREE.Vector3(),speed:0,side:0,steer:0,throttle:0,brake:0,gear:1,rpm:900,slip:false,damage:0};
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyC')camMode=1-camMode;if(e.code==='KeyR')resetCar();if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('click',()=>document.body.requestPointerLock?.());
function resetCar(){car.pos.set(0,.08,0);car.yaw=Math.PI;car.vel.set(0,0,0);car.side=0;for(const s of smoke)scene.remove(s.m);smoke.length=0;}

const ai=[];const lanes=[-3.1,3.1];function spawnAI(n=34){for(let k=0;k<n;k++){const vertical=Math.random()<.5;const road=(Math.floor(rnd(-CITY,CITY+1))*BLOCK);const lane=lanes[Math.floor(Math.random()*2)];const a={mesh:makeCar([0xff3344,0xffa500,0x22ccff,0xbbff44,0xffffff][k%5]),vertical,dir:Math.random()<.5?1:-1,t:rnd(-HALF,HALF),road,lane,speed:rnd(8,18),targetSpeed:rnd(9,22),wait:0,r:2.5};scene.add(a.mesh);ai.push(a)}}spawnAI();
function nearestSignal(x,z){let best=null,bd=999;for(const s of signals){const d=(s.x-x)**2+(s.z-z)**2;if(d<bd){bd=d;best=s}}return best}
function updateAI(dt){for(const a of ai){const ix=Math.round((a.vertical?a.t:a.road)/BLOCK)*BLOCK, iz=Math.round((a.vertical?a.road:a.t)/BLOCK)*BLOCK;const sig=nearestSignal(a.vertical?a.road:a.t,a.vertical?a.t:a.road);let red=false;if(sig&&Math.abs((a.vertical?a.t:a.t)- (a.vertical?sig.z:sig.x))<11){const phase=(performance.now()/1000+sig.phase)%18;red=phase<7.5}
 let blocked=false; for(const b of ai){if(b===a||b.vertical!==a.vertical)continue; if(Math.abs(b.road-a.road)<2 && b.dir===a.dir){const gap=(b.t-a.t)*a.dir;if(gap>0&&gap<12)blocked=true}}
 const desired=(red||blocked)?0:a.targetSpeed; a.speed=lerp(a.speed,desired,dt*(desired<a.speed?2.5:.7)); a.t+=a.dir*a.speed*dt; if(a.t>HALF)a.t=-HALF;if(a.t<-HALF)a.t=HALF; if(Math.abs((a.t/BLOCK)-Math.round(a.t/BLOCK))<.055 && Math.random()<.012){a.vertical=!a.vertical; const old=a.road;a.road=Math.round(a.t/BLOCK)*BLOCK; a.t=old; a.dir=Math.random()<.5?1:-1}
 const x=a.vertical?a.road+a.lane:a.t, z=a.vertical?a.t:a.road+a.lane; a.mesh.position.set(x,.08,z); a.mesh.rotation.y=a.vertical?(a.dir>0?0:Math.PI):(a.dir>0?-Math.PI/2:Math.PI/2);}}

const rainCount=5200;const rainGeo=new THREE.BufferGeometry();const rainPos=new Float32Array(rainCount*3);const rainVel=new Float32Array(rainCount);for(let i=0;i<rainCount;i++){rainPos[i*3]=rnd(-90,90);rainPos[i*3+1]=rnd(3,75);rainPos[i*3+2]=rnd(-90,90);rainVel[i]=rnd(22,48)}rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xaedfff,size:.055,transparent:true,opacity:.68,blending:THREE.AdditiveBlending}));scene.add(rain);
const splashGeo=new THREE.BufferGeometry();const splashPos=new Float32Array(900*3);splashGeo.setAttribute('position',new THREE.BufferAttribute(splashPos,3));const splashes=new THREE.Points(splashGeo,new THREE.PointsMaterial({color:0x99ddff,size:.08,transparent:true,opacity:.42,blending:THREE.AdditiveBlending}));scene.add(splashes);
const smoke=[];const spark=[];let sprayAcc=0;function puff(x,z,c=0x9fb6c8,sz=.16){if(smoke.length>150){const old=smoke.shift();scene.remove(old.m)}const m=new THREE.Mesh(new THREE.SphereGeometry(rnd(sz*.55,sz),8,6),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.22,depthWrite:false}));m.position.set(x,rnd(.08,.26),z);scene.add(m);smoke.push({m,life:rnd(.22,.55),v:new THREE.Vector3(rnd(-.45,.45),rnd(.05,.22),rnd(-.45,.45))})}function sparks(x,z){for(let i=0;i<18;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.045,6,4),new THREE.MeshBasicMaterial({color:0xffb84e}));m.position.set(x,.45,z);scene.add(m);spark.push({m,life:rnd(.18,.45),v:new THREE.Vector3(rnd(-6,6),rnd(1,5),rnd(-6,6))})}}

const checkpoints=[];let cpIndex=0,startTime=0,best=+(localStorage.bestRainDrive||0),running=false;function newRace(){for(const c of checkpoints)scene.remove(c.group);checkpoints.length=0;cpIndex=0;running=false;startTime=0;let pts=[];for(let i=0;i<7;i++)pts.push(new THREE.Vector3(Math.floor(rnd(-CITY+2,CITY-2))*BLOCK,0,Math.floor(rnd(-CITY+2,CITY-2))*BLOCK));for(let i=0;i<pts.length;i++){const group=new THREE.Group();const mat=new THREE.MeshBasicMaterial({color:i?0x00e5ff:0xff2bd6,transparent:true,opacity:.62,blending:THREE.AdditiveBlending});const ring=new THREE.Mesh(new THREE.TorusGeometry(5.4,.22,12,64),mat);ring.rotation.x=Math.PI/2;ring.position.y=2.2;group.add(ring);const cone=new THREE.Mesh(new THREE.ConeGeometry(2.6,7,32,1,true),mat);cone.position.y=3.5;group.add(cone);group.position.copy(pts[i]);scene.add(group);checkpoints.push({group,pos:pts[i]})}}newRace();document.getElementById('race').addEventListener('click',newRace);addEventListener('click',e=>{if(e.target.id==='race')newRace()});

let camMode=0,camPos=new THREE.Vector3(0,2.6,-7.5);const panel=document.getElementById('panel'),raceDiv=document.getElementById('race'),speedDiv=document.getElementById('speed'),map=document.getElementById('map'),ctx=map.getContext('2d'),flash=document.getElementById('flash');let rainIntensity=.8,nextLightning=rnd(8,20),lightLeft=0;
function trafficLights(t){for(const s of signals){const p=(t+s.phase)%18;const on=p<7.5?0:p<9?1:2;for(let i=0;i<3;i++)s.bulbs[i].material.emissiveIntensity=i===on?2.2:.12}}
function hitAABB(pos,r,o){return Math.abs(pos.x-o.x)<o.w/2+r&&Math.abs(pos.z-o.z)<o.d/2+r}
function physics(dt){car.throttle=(keys.KeyW||keys.ArrowUp)?1:0;car.brake=(keys.KeyS||keys.ArrowDown)?1:0;const hand=keys.Space?1:0;const steerIn=(keys.KeyA?1:0)-(keys.KeyD?1:0);car.steer=lerp(car.steer,steerIn,dt*5.5);const forward=new THREE.Vector3(-Math.sin(car.yaw),0,-Math.cos(car.yaw));const right=new THREE.Vector3(Math.cos(car.yaw),0,-Math.sin(car.yaw));let fwd=car.vel.dot(forward), side=car.vel.dot(right);const kmh=Math.abs(fwd)*3.6;const grip=clamp(1.25-kmh/180-hand*.8, .18, 1);const accel=car.throttle*18-(car.brake?(fwd>1?28:12):0);fwd+=accel*dt;if(car.brake&&fwd<2)fwd-=10*dt;fwd*=1-dt*.18;side*=Math.pow(.045+grip*.72,dt*7);const turn=car.steer*clamp(Math.abs(fwd)/9,0,1.9)*(fwd>=0?1:-.65)*(hand?1.45:1);car.yaw+=turn*dt;car.slip=Math.abs(side)>3.0||hand&&Math.abs(fwd)>8||Math.abs(turn)>1.05; if(car.slip){side+=car.steer*Math.abs(fwd)*dt*4.5; for(let i=0;i<3;i++)puff(car.pos.x+rnd(-1.3,1.3),car.pos.z+rnd(1.1,2.3));}
car.vel.copy(forward.multiplyScalar(fwd).add(right.multiplyScalar(side)));car.pos.addScaledVector(car.vel,dt);car.pos.x=clamp(car.pos.x,-HALF+8,HALF-8);car.pos.z=clamp(car.pos.z,-HALF+8,HALF-8);
for(const o of colliders){if(hitAABB(car.pos,1.65,o)){const dx=car.pos.x-o.x,dz=car.pos.z-o.z;const push=new THREE.Vector3(dx,0,dz).normalize();car.pos.addScaledVector(push,1.2);car.vel.reflect(push).multiplyScalar(.28);sparks(car.pos.x,car.pos.z)}}
for(const a of ai){const d=car.pos.distanceTo(a.mesh.position);if(d<3.1){const push=car.pos.clone().sub(a.mesh.position).normalize();car.pos.addScaledVector(push,(3.1-d)*.7);car.vel.addScaledVector(push,12);car.vel.multiplyScalar(.55);sparks(car.pos.x,car.pos.z)}}
car.speed=car.vel.length();car.gear=fwd<-.5?'R':Math.max(1,Math.min(6,Math.floor(kmh/38)+1));car.rpm=clamp(900+(kmh%38)/38*5200+car.throttle*900,800,7200);playerMesh.position.copy(car.pos);playerMesh.rotation.y=car.yaw;
sprayAcc+=dt*car.speed*rainIntensity*.65;const back=car.pos.clone().addScaledVector(forward,-2.25),sideVec=new THREE.Vector3(Math.cos(car.yaw),0,-Math.sin(car.yaw));while(sprayAcc>1){sprayAcc--;const p=back.clone().addScaledVector(sideVec,rnd(-1.15,1.15));puff(p.x,p.z,0x6aa5bd,.18)}
if(checkpoints[cpIndex]){const d=car.pos.distanceTo(checkpoints[cpIndex].pos);checkpoints[cpIndex].group.children.forEach(m=>m.material.opacity=.88+.12*Math.sin(performance.now()*.01));if(d<7.2&&Math.abs(fwd)>10){if(cpIndex===0&&!running){running=true;startTime=performance.now()}cpIndex++;if(cpIndex>=checkpoints.length){const tm=(performance.now()-startTime)/1000;if(!best||tm<best){best=tm;localStorage.bestRainDrive=best.toFixed(2)}newRace()}}}}
function updateRain(dt){rainIntensity=clamp(rainIntensity+Math.sin(performance.now()*.00013)*dt*.05+rnd(-.02,.02)*dt,.45,1.25);const p=rain.geometry.attributes.position.array;for(let i=0;i<rainCount;i++){p[i*3+1]-=rainVel[i]*dt*rainIntensity;p[i*3]+=car.vel.x*dt*.22;p[i*3+2]+=car.vel.z*dt*.22;if(p[i*3+1]<0){p[i*3]=car.pos.x+rnd(-80,80);p[i*3+1]=rnd(25,75);p[i*3+2]=car.pos.z+rnd(-80,80)}}rain.geometry.attributes.position.needsUpdate=true; const sp=splashes.geometry.attributes.position.array;for(let i=0;i<300;i++){sp[i*3]=car.pos.x+rnd(-10,10);sp[i*3+1]=.08;sp[i*3+2]=car.pos.z+rnd(-18,12)}splashes.geometry.attributes.position.needsUpdate=true}
function updateParticles(dt){for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.life-=dt;s.m.position.addScaledVector(s.v,dt);s.m.scale.multiplyScalar(1+dt*1.8);s.m.material.opacity=s.life*.34;if(s.life<=0){scene.remove(s.m);smoke.splice(i,1)}}for(let i=spark.length-1;i>=0;i--){const s=spark[i];s.life-=dt;s.v.y-=12*dt;s.m.position.addScaledVector(s.v,dt);s.m.material.opacity=s.life*2;if(s.life<=0){scene.remove(s.m);spark.splice(i,1)}}}
function updateCamera(dt){const f=new THREE.Vector3(-Math.sin(car.yaw),0,-Math.cos(car.yaw));const up=new THREE.Vector3(0,1,0);if(camMode===0){const target=car.pos.clone().add(f.clone().multiplyScalar(-7.2-car.speed*.035)).add(up.clone().multiplyScalar(2.45+car.speed*.008));camPos.lerp(target,1-Math.pow(.00008,dt));camera.position.copy(camPos);camera.lookAt(car.pos.clone().add(f.clone().multiplyScalar(7.5+car.speed*.08)).add(up.clone().multiplyScalar(.18)));camera.fov=lerp(camera.fov,64+clamp(car.speed*.72,0,16),dt*2.2)}else{const right=new THREE.Vector3(Math.cos(car.yaw),0,-Math.sin(car.yaw));camera.position.copy(car.pos.clone().add(up.clone().multiplyScalar(1.18)).add(f.clone().multiplyScalar(-.22)).add(right.multiplyScalar(.16)));camera.lookAt(car.pos.clone().add(f.clone().multiplyScalar(18)).add(up.clone().multiplyScalar(.18)));camera.fov=lerp(camera.fov,72+clamp(car.speed*1.1,0,20),dt*2)}camera.updateProjectionMatrix()}
function drawMap(){ctx.clearRect(0,0,460,460);ctx.fillStyle='rgba(0,12,22,.78)';ctx.fillRect(0,0,460,460);ctx.save();ctx.translate(230,230);const sc=.54;ctx.rotate(-car.yaw);ctx.translate(-car.pos.x*sc,-car.pos.z*sc);ctx.strokeStyle='rgba(120,220,255,.35)';ctx.lineWidth=7;for(let i=-CITY;i<=CITY;i++){ctx.beginPath();ctx.moveTo(i*BLOCK*sc,-HALF*sc);ctx.lineTo(i*BLOCK*sc,HALF*sc);ctx.stroke();ctx.beginPath();ctx.moveTo(-HALF*sc,i*BLOCK*sc);ctx.lineTo(HALF*sc,i*BLOCK*sc);ctx.stroke()}ctx.fillStyle='#ff34d2';if(checkpoints[cpIndex]){ctx.beginPath();ctx.arc(checkpoints[cpIndex].pos.x*sc,checkpoints[cpIndex].pos.z*sc,8,0,TAU);ctx.fill()}ctx.fillStyle='#ff5';for(const a of ai){if(car.pos.distanceTo(a.mesh.position)<120)ctx.fillRect(a.mesh.position.x*sc-3,a.mesh.position.z*sc-3,6,6)}ctx.restore();ctx.fillStyle='#38f6ff';ctx.beginPath();ctx.moveTo(230,208);ctx.lineTo(244,246);ctx.lineTo(230,238);ctx.lineTo(216,246);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.strokeRect(1,1,458,458)}
function hud(){const kmh=Math.round(car.speed*3.6);speedDiv.innerHTML=`${kmh}<span class="unit">km/h</span>`;panel.innerHTML=`RPM <b>${Math.round(car.rpm)}</b><br>档位 <b>${car.gear}</b><br>油门 <b>${Math.round(car.throttle*100)}%</b>　刹车 <b>${Math.round(car.brake*100)}%</b><br>转向角 <b>${Math.round(car.steer*32)}°</b><br>抓地状态 <b style="color:${car.slip?'#ff5a9f':'#62ffb7'}">${car.slip?'正在打滑 / 漂移':'稳定'}</b><br>雨量 <b>${Math.round(rainIntensity*100)}%</b>　视角 <b>${camMode?'驾驶舱':'追尾'}</b>`;let now=running?(performance.now()-startTime)/1000:0;raceDiv.innerHTML=`<b>CHECKPOINT ${Math.min(cpIndex+1,checkpoints.length)} / ${checkpoints.length}</b><br>当前时间 <b>${now?now.toFixed(2):'--'}</b><br>最佳时间 <b>${best?Number(best).toFixed(2):'--'}</b><br><span style="color:#ff9df1">点击这里 Reset Race</span>`}
let last=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min(.033,(t-last)/1000);last=t;trafficLights(t/1000);physics(dt);updateAI(dt);updateRain(dt);updateParticles(dt);updateCamera(dt);drawMap();hud();nextLightning-=dt;if(nextLightning<0){lightLeft=.22;nextLightning=rnd(10,26);flash.style.opacity='.78'}if(lightLeft>0){lightLeft-=dt;lightning.intensity=lerp(lightning.intensity,10,dt*20);hemi.intensity=.75;scene.fog.density=.004;if(lightLeft<=0){flash.style.opacity='0';lightning.intensity=0;hemi.intensity=.42;scene.fog.density=.0095}}renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
